name: ReelSyntax render and QC
description: Render a project and summarize its technical checks
inputs:
  project:
    description: Project directory relative to the checkout
    required: true
  profile:
    description: Render profile
    default: draft
  comment:
    description: Post a QC summary on the current pull request
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        RS_PROJECT: ${{ inputs.project }}
        RS_PROFILE: ${{ inputs.profile }}
      run: |
        python -m pip install "${GITHUB_ACTION_PATH}[render]"
        reelsyntax render "$RS_PROJECT" --profile "$RS_PROFILE"
        reelsyntax qc "$RS_PROJECT" --profile "$RS_PROFILE" --html > "$RUNNER_TEMP/reelsyntax-qc.json"
    - if: always()
      shell: python
      run: |
        import json
        import os
        from pathlib import Path
        source = Path(os.environ['RUNNER_TEMP'], 'reelsyntax-qc.json')
        summary = 'ReelSyntax render or QC did not produce a report.'
        if source.is_file() and source.stat().st_size:
            report = json.loads(source.read_text())['result']
            rows = [f"| {c['id']} | {c['status']} |" for c in report['checks']]
            summary = '\n'.join([f"ReelSyntax QC — {report['technical_status']}", '', '| Check | Result |', '| --- | --- |', *rows])
        Path(os.environ['RUNNER_TEMP'], 'reelsyntax-summary.md').write_text(summary, encoding='utf-8')
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
            print(summary, file=stream)
    - if: always() && inputs.comment == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RS_PR: ${{ github.event.pull_request.number }}
      run: gh pr comment "$RS_PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/reelsyntax-summary.md"
