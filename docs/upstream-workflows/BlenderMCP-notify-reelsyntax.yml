name: Notify ReelSyntax on Main Update

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: notify-reelsyntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: "!contains(github.event.head_commit.message, '[skip-sync]')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint GitHub App token if configured
        id: app_token
        if: ${{ secrets.REELSYNTAX_SYNC_APP_ID != '' && secrets.REELSYNTAX_SYNC_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
        with:
          app-id: ${{ secrets.REELSYNTAX_SYNC_APP_ID }}
          private-key: ${{ secrets.REELSYNTAX_SYNC_APP_PRIVATE_KEY }}
          owner: Remirdy
          repositories: ReelSyntax

      - name: Send repository_dispatch to Remirdy/ReelSyntax
        env:
          DISPATCH_TOKEN: ${{ steps.app_token.outputs.token || secrets.REELSYNTAX_DISPATCH_TOKEN }}
          EVENT_TYPE: ${{ github.event_name == 'release' && 'release-published' || 'submodule-updated' }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "Configure REELSYNTAX_SYNC_APP_ID + REELSYNTAX_SYNC_APP_PRIVATE_KEY or REELSYNTAX_DISPATCH_TOKEN in repository secrets." >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Remirdy/ReelSyntax/dispatches \
            -d "{\"event_type\":\"${EVENT_TYPE}\",\"client_payload\":{\"target\":\"blender\",\"repository\":\"Remirdy/BlenderMCP\",\"sha\":\"${SHA}\",\"ref\":\"${REF}\"}}"
