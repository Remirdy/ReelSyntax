name: Container
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE: ghcr.io/remirdy/reelsyntax
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build runtime image
        run: docker build --target runtime --build-arg REVISION="${GITHUB_SHA}" -t reelsyntax:ci .
      - name: Doctor via default entrypoint
        run: docker run --rm --network none reelsyntax:ci doctor --json
      - name: Doctor via python module invocation
        run: docker run --rm --network none --entrypoint "" reelsyntax:ci python3 -m reelsyntax doctor --json
      - name: Non-root user and entrypoint
        run: |
          test "$(docker run --rm --entrypoint id reelsyntax:ci -u)" != "0"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' reelsyntax:ci)" = '["python3","-m","reelsyntax"]'
          test "$(docker image inspect --format '{{.Config.WorkingDir}}' reelsyntax:ci)" = "/workspace"
      - name: Offline dry run in mounted workspace
        run: |
          mkdir -p "${RUNNER_TEMP}/workspace"
          chmod 0777 "${RUNNER_TEMP}/workspace"
          docker run --rm --network none --read-only --tmpfs /tmp -e HOME=/tmp/home \
            -v "${RUNNER_TEMP}/workspace:/workspace" reelsyntax:ci \
            make "12s vertical kinetic reel about deterministic builds" --provider offline_rules --dry-run --json
      - name: Compose configuration
        run: docker compose config --quiet
      - name: Dev container target
        run: docker build --target dev -t reelsyntax:dev .
  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Resolve tags
        id: tags
        run: |
          short_sha="${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}:${version} ${IMAGE}:latest ${IMAGE}:sha-${short_sha}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${short_sha}" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}:sha-${short_sha} ${IMAGE}:edge" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release image
        env:
          VERSION: ${{ steps.tags.outputs.version }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          args=()
          for tag in ${TAGS}; do args+=(-t "${tag}"); done
          docker build --target runtime --build-arg VERSION="${VERSION}" --build-arg REVISION="${GITHUB_SHA}" "${args[@]}" .
          docker run --rm --network none --entrypoint "" "${IMAGE}:sha-${GITHUB_SHA::12}" python3 -m reelsyntax doctor --json
      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: Push
        id: push
        run: |
          docker push --all-tags ghcr.io/remirdy/reelsyntax
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:sha-${GITHUB_SHA::12}")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ghcr.io/remirdy/reelsyntax
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Log out
        if: always()
        run: docker logout ghcr.io
