name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9
        with:
          languages: python
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9
        with:
          category: /language:python

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[browser]' pip-audit
      - run: pip-audit --skip-editable

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        continue-on-error: true
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0, SSPL-1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[browser]'
      - name: Verify installed dependency licenses
        shell: python
        run: |
          import importlib.metadata

          denied = ("GPL-2.0", "GPL-3.0", "AGPL-3.0", "LGPL-2.1", "LGPL-3.0", "SSPL-1.0")
          violations = []
          for dist in importlib.metadata.distributions():
              name = dist.metadata.get("Name", "")
              lic = " ".join([
                  dist.metadata.get("License") or "",
                  dist.metadata.get("License-Expression") or "",
                  *[c for c in dist.metadata.get_all("Classifier", ()) if "License ::" in c],
              ])
              if any(bad in lic for bad in denied):
                  violations.append((name, lic))
          assert not violations, f"Disallowed copyleft dependency licenses: {violations}"
