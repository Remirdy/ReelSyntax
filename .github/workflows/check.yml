name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m compileall -q reelsyntax ReelSyntax_Skills/tools
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s ReelSyntax_Skills/tests -v
      - run: reelsyntax skills validate
      - run: reelsyntax skills test
  submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: python -m reelsyntax.sync_audit --target blender
      - run: python -m reelsyntax.sync_audit --target after-effects
      - run: reelsyntax integrations --json
  media:
    runs-on: ubuntu-latest
    env:
      REELSYNTAX_MEDIA_TESTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install '.[render]'
      - run: ffmpeg -version
      - run: ffprobe -version
      - run: python -m unittest discover -s tests -v
