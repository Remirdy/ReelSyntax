name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m compileall -q reelsyntax ReelSyntax_Skills/tools
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s ReelSyntax_Skills/tests -v
      - run: reelsyntax skills validate
      - run: reelsyntax skills test
  submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: python -m reelsyntax.sync_audit --target blender
      - run: python -m reelsyntax.sync_audit --target after-effects
      - run: reelsyntax integrations --json
  media:
    runs-on: ubuntu-latest
    env:
      REELSYNTAX_MEDIA_TESTS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip install '.[render]'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: ffmpeg -version
      - run: ffprobe -version
      - run: python -m unittest discover -s tests -v
