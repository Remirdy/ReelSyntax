name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install ruff mypy coverage
      - run: ruff check reelsyntax ReelSyntax_Skills/tools tests
      - run: mypy
      - run: coverage run -m unittest discover -s tests
      - run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m compileall -q reelsyntax ReelSyntax_Skills/tools
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s ReelSyntax_Skills/tests -v
      - run: reelsyntax skills validate
      - run: reelsyntax skills test
  submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: python -m reelsyntax.sync_audit --target blender
      - run: python -m reelsyntax.sync_audit --target after-effects
      - run: reelsyntax integrations --json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build -f .devcontainer/Dockerfile -t reelsyntax-media .
      - run: docker run --rm reelsyntax-media python -m reelsyntax doctor --json
  media:
    runs-on: ubuntu-latest
    env:
      REELSYNTAX_MEDIA_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - run: python -m pip install '.[render]'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: ffmpeg -version
      - run: ffprobe -version
      - run: python -m unittest discover -s tests -v
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install -r docs/requirements.txt
      - run: mkdocs build --strict
