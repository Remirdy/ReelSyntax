site_name: ReelSyntax
site_description: Build and review a video from a local, frame-based project file.
site_author: Remirdy
site_url: https://remirdy.github.io/ReelSyntax/
repo_url: https://github.com/Remirdy/ReelSyntax
repo_name: Remirdy/ReelSyntax
edit_uri: edit/main/docs/
theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false
  language: en
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Remirdy
      name: Remirdy on GitHub
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search
hooks:
  - tools/docs_catalog.py
nav:
  - Start: index.md
  - Getting started: getting-started.md
  - Installation: installation.md
  - Project format: project-format.md
  - Authoring and delivery: delivery.md
  - Localization:
      - Glossary: i18n/glossary.md
      - Language guide: i18n/CONTRIBUTING.md
  - CLI: cli.md
  - Quality: quality.md
  - Runtime coverage: runtime-coverage.md
  - Skill catalog: catalog.md
  - Releasing: releasing.md
  - Troubleshooting: troubleshooting.md
