[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "reelsyntax"
version = "0.1.0"
description = "Local skill routing and deterministic headless motion production"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
render = ["Pillow==12.2.0"]
browser = ["Pillow==12.2.0", "playwright==1.65.2"]

[project.scripts]
reelsyntax = "reelsyntax.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reelsyntax", "ReelSyntax_Skills", "ReelSyntax_Skills.tools"]
namespaces = true

[tool.setuptools.package-data]
ReelSyntax_Skills = ["registry/index.json", "registry/relations.json", "registry/catalog.csv", "library/*/*/SKILL.md", "library/*/*/references/*", ".agents/skills/reelsyntax-router/SKILL.md", "tests/routing-eval.json", "QUALITY_STANDARD.md", "SKILL_SYSTEM.md"]
reelsyntax = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["integrations", "build", ".tools"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F841", "B006"]

[tool.ruff.lint.per-file-ignores]
"reelsyntax/blender_aperture.py" = ["F841"]
"reelsyntax/blender_cassette.py" = ["F401"]
"reelsyntax/drawing.py" = ["F401", "F841"]
"reelsyntax/gateway.py" = ["F401"]
"reelsyntax/ingest.py" = ["F401"]
"reelsyntax/sync_audit.py" = ["F401"]
"tests/test_gateway_and_mcp.py" = ["F401"]
"tests/test_production_features.py" = ["F401", "F841"]
"tests/test_skills.py" = ["F401"]

[tool.ruff.format]
quote-style = "preserve"

[tool.mypy]
python_version = "3.11"
files = ["reelsyntax/contracts.py"]
strict = true

[tool.coverage.run]
branch = true
source = ["reelsyntax", "ReelSyntax_Skills.tools"]

[tool.coverage.report]
show_missing = true
skip_empty = true
